services:
  postgres:
    image: postgres:15-alpine
    container_name: rsl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roadside_logistics
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roadside_logistics"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: rsl_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/roadside_logistics
      JWT_SECRET_KEY: rsl_dev_secret_key_84920193850183749281729384719284
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8008:8000"
    volumes:
      - ./app:/app/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
